name: v10.4.3 plastic-dominance validation

on:
  push:
    branches:
      - v10.4.3-plastic-dominance-censor
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e '.[test]'

      - name: Validate generated scheduler and focused physics tests
        env:
          USE_CURRENT_PYTHON: "1"
          SKIP_BRANCH_CHECK: "1"
          ALLOW_DIRTY: "1"
        run: bash scripts/validate_v10_4_3_plastic_dominance.sh
