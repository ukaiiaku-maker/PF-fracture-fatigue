name: V5 unified cavity source recovery V2

on:
  push:
    branches:
      - codex/v5-unified-fracture-multitip-voiding
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-unified-cavity-source-recovery-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-recovery-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOIDING_V5_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Initialize attestation directory
        run: |
          set -euo pipefail
          echo "ATTESTATION_DIR=${RUNNER_TEMP}/v5-cavity-source-recovery-v2" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/v5-cavity-source-recovery-v2"

      - name: Partial sparse checkout of bounded inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone \
            /arrhenius_fracture/ \
            /artifacts/voiding_v5_finalization_v2/checkpoints/connected_before_downstream.json \
            /artifacts/voiding_v5_finalization_v2/checkpoints/connected_before_downstream.json.state.pkl \
            /artifacts/voiding_v5_finalization_v2/checkpoints/downstream_front_before_continuation.json \
            /artifacts/voiding_v5_finalization_v2/checkpoints/downstream_front_before_continuation.json.state.pkl \
            /artifacts/v5_cavity_source_recovery_v2/attestation.json \
            /scripts/build_v5_unified_lineage_records.py \
            /tests/__init__.py \
            /tests/test_live_topology_kernel_v11.py \
            /tests/test_v5_unified_model_lineage.py \
            /tests/test_v5_bounded_sharp_front_adapter.py \
            /tests/test_v5_hybrid_directional_drive.py \
            /tests/test_cavity_source_recovery_v2.py \
            /V5_UNIFIED_MODEL_LINEAGE.md \
            /V5_VOIDING_EXTENSION_DELTA.md \
            /v5_unified_model_lineage.json \
            /v5_voiding_extension_delta.json \
            /pyproject.toml \
            /requirements-v5-source-resolution-ci.txt
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          for source in \
            7e71b8f27b0682060fd161e7e5e8fe0d3587e8ac \
            0238aae096aa29e79829d3c562383c38f2290ad6 \
            b3d0add6cbb0605adaa3e04006fe987961ad6452 \
            ca4abfe47765fcdaf0d266bfc0558ecd82d0c64e \
            619b66b0f538742482e7385ddd3d0171cb3edd8b; do
            git fetch --no-tags --depth=1 --filter=blob:none origin "$source"
          done
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-v5-source-resolution-ci.txt

      - name: Install frozen numerical environment
        run: python -m pip install -e '.[test]' -r requirements-v5-source-resolution-ci.txt

      - name: Compile bounded sources
        run: |
          python -m compileall -q \
            arrhenius_fracture/cavity_source_recovery_v2.py \
            arrhenius_fracture/voiding_production_v5.py \
            scripts/build_v5_unified_lineage_records.py \
            tests/test_cavity_source_recovery_v2.py

      - name: Collect exact bounded inventory
        run: |
          set -euo pipefail
          TEST_FILES=(
            tests/test_v5_unified_model_lineage.py
            tests/test_v5_bounded_sharp_front_adapter.py
            tests/test_v5_hybrid_directional_drive.py
            tests/test_cavity_source_recovery_v2.py
          )
          python -m pytest --collect-only -q -p no:cacheprovider "${TEST_FILES[@]}" \
            | tee "$ATTESTATION_DIR/collect-only.log"
          test "$(grep -Ec '^[^[:space:]]+::' "$ATTESTATION_DIR/collect-only.log")" = 42

      - name: Run bounded lineage, material, recovery, and readiness checks once
        run: |
          set -euo pipefail
          TEST_FILES=(
            tests/test_v5_unified_model_lineage.py
            tests/test_v5_bounded_sharp_front_adapter.py
            tests/test_v5_hybrid_directional_drive.py
            tests/test_cavity_source_recovery_v2.py
          )
          python -m pytest -vv -p no:cacheprovider \
            --junitxml="$ATTESTATION_DIR/pytest-junit.xml" "${TEST_FILES[@]}" \
            | tee "$ATTESTATION_DIR/pytest.log"

      - name: Verify generated lineage and clean worker
        if: always()
        run: |
          set -euo pipefail
          python scripts/build_v5_unified_lineage_records.py
          git diff --exit-code
          git diff --check
          test -z "$(git status --porcelain=v1)"
          {
            echo 'qualified_core_inventory=238/244'
            echo 'reviewed_adapter_files=6'
            echo 'CAVITY_SOURCE_RECOVERY_V1_INCIDENT_CST_MAX_PRINCIPAL=FAIL_NONCONVERGENT'
            echo 'CAVITY_FIXED_ARC_PATCH_RECOVERY_V2=QUALIFIED_MANUFACTURED_KIRSCH'
            echo 'DBTT_READINESS=BLOCKED_TANGENTIAL_STRESS_CONVERGENCE'
            echo 'ORACLE_STATES_ACCEPTED=0/18'
            echo 'PAIRED_TRAJECTORIES_RUN=0/12'
            echo 'FATIGUE_IMPLEMENTATION=NOT_STARTED_BY_CONTRACT'
            echo 'clean_worktree=PASS'
            echo 'diff_check=PASS'
          } | tee "$ATTESTATION_DIR/classifications.txt"

      - name: Upload bounded attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-cavity-source-recovery-v2-${{ github.sha }}
          path: ${{ runner.temp }}/v5-cavity-source-recovery-v2/
          if-no-files-found: error
          retention-days: 14
