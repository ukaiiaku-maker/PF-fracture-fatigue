name: V12 production integration
on:
  push:
    branches: [codex/v12-sharp-wake-production-integration]
  pull_request:
    branches: [codex/v12-mechanically-separating-sharp-wake]
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy scipy pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_stage2_criterion_v12.py tests/test_sharp_wake_backend_v12.py tests/test_topology_transaction_v11.py tests/test_v12_mechanically_separating_wake.py tests/test_v11_causal_sharp_wake.py
      - run: PYTHONPATH=. python scripts/qualify_v12_production_integration.py /tmp/evidence-a
      - run: PYTHONPATH=. python scripts/qualify_v12_production_integration.py /tmp/evidence-b
      - run: diff -rq /tmp/evidence-a /tmp/evidence-b
      - run: git diff --check
