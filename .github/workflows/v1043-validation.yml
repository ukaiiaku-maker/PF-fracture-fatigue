name: v10.4.3 validation

on:
  push:
    branches:
      - v10.4.3-stagger-consistent-plastic-terminal
  pull_request:
    branches:
      - v10.4.2-plastic-flow-terminal

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile package
        run: python -m compileall -q arrhenius_fracture scripts tests
      - name: Run v10.4.3 targeted tests
        run: >-
          python -m pytest -q
          tests/test_v10_4_2_directional_j_positive.py
          tests/test_v10_4_2_plastic_flow_terminal.py
          tests/test_v10_4_2_reuse_aware_launcher.py
          tests/test_v10_4_2_launcher_adapter.py
          tests/test_v10_4_bulk_peierls_taylor.py
          tests/test_v10_4_1_detailed_balance.py
      - name: Generate final launcher and syntax-check
        run: |
          python scripts/build_v10_4_2_reuse_aware_launcher.py \
            --source scripts/run_v10_2_28_paper_four_class_theta30_1000um.sh \
            --output /tmp/v1043-generated.sh
          bash -n /tmp/v1043-generated.sh
          grep -q 'RERUN_REQUIRED_STAGGER_TIME_CORRECTION' /tmp/v1043-generated.sh
          grep -q 'SKIP_REUSED_VERIFIED' /tmp/v1043-generated.sh

  full-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Full pytest suite
        run: python -m pytest -q
