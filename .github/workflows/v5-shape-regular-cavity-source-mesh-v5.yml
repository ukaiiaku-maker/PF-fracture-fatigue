name: V5 shape-regular cavity source mesh V5

on:
  push:
    branches:
      - codex/v5-unified-fracture-multitip-voiding
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-shape-regular-cavity-source-mesh-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-shape-regular-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOIDING_V5_SOURCE_COMMIT: c0011abb0dd48ee259f4838a354947cf34e4cd46
      V5_SOURCE_COMMIT: c0011abb0dd48ee259f4838a354947cf34e4cd46
    steps:
      - name: Initialize bounded attestation directory
        run: |
          echo "ATTESTATION_DIR=${RUNNER_TEMP}/v5-shape-regular-v5" >> "$GITHUB_ENV"
          echo "V5_READINESS_OUTPUT=${RUNNER_TEMP}/v5-shape-regular-v5/central-dbtt-v5-readiness.json" >> "$GITHUB_ENV"
          echo "MPLCONFIGDIR=${RUNNER_TEMP}/matplotlib-v5-shape-regular-v5" >> "$GITHUB_ENV"
          mkdir -p \
            "${RUNNER_TEMP}/v5-shape-regular-v5" \
            "${RUNNER_TEMP}/matplotlib-v5-shape-regular-v5"

      - name: Partial sparse checkout of bounded inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone \
            /arrhenius_fracture/ \
            /artifacts/voiding_v5_finalization_v2/checkpoints/connected_before_downstream.json \
            /artifacts/voiding_v5_finalization_v2/checkpoints/connected_before_downstream.json.state.pkl \
            /artifacts/v5_cavity_source_recovery_v2/attestation.json \
            /artifacts/v5_cavity_source_recovery_v3/ \
            /artifacts/v5_cavity_source_recovery_v4/ \
            /artifacts/v5_cavity_source_recovery_v5/ \
            /scripts/audit_v2_physical_patch_without_fem.py \
            /scripts/attest_cavity_source_recovery_v3_dbtt.py \
            /scripts/attest_cavity_source_shape_regular_v5_dbtt.py \
            /scripts/audit_v4_mesh_failure_without_fem.py \
            /scripts/build_cavity_source_shape_regular_v5_contract.py \
            /scripts/build_cavity_source_geometry_v4_contract.py \
            /scripts/build_v5_unified_lineage_records.py \
            /tests/__init__.py \
            /tests/test_v5_unified_model_lineage.py \
            /tests/test_cavity_source_recovery_v3.py \
            /tests/test_cavity_source_conforming_geometry_v4.py \
            /tests/test_cavity_source_shape_regular_mesh_v5.py \
            /V5_UNIFIED_MODEL_LINEAGE.md \
            /V5_VOIDING_EXTENSION_DELTA.md \
            /v5_unified_model_lineage.json \
            /v5_voiding_extension_delta.json \
            /pyproject.toml \
            /requirements-v5-source-resolution-ci.txt
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          for source in \
            7e71b8f27b0682060fd161e7e5e8fe0d3587e8ac \
            0238aae096aa29e79829d3c562383c38f2290ad6 \
            b3d0add6cbb0605adaa3e04006fe987961ad6452 \
            ca4abfe47765fcdaf0d266bfc0558ecd82d0c64e \
            619b66b0f538742482e7385ddd3d0171cb3edd8b; do
            git fetch --no-tags --depth=2 --filter=blob:none origin "$source"
          done
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-v5-source-resolution-ci.txt

      - name: Install frozen numerical environment
        run: python -m pip install -e '.[test]' -r requirements-v5-source-resolution-ci.txt

      - name: Compile bounded sources
        run: |
          python -m compileall -q \
            arrhenius_fracture \
            scripts/attest_cavity_source_shape_regular_v5_dbtt.py \
            scripts/audit_v4_mesh_failure_without_fem.py \
            scripts/build_cavity_source_shape_regular_v5_contract.py \
            scripts/build_cavity_source_geometry_v4_contract.py \
            scripts/build_v5_unified_lineage_records.py \
            tests/test_v5_unified_model_lineage.py \
            tests/test_cavity_source_recovery_v3.py \
            tests/test_cavity_source_conforming_geometry_v4.py \
            tests/test_cavity_source_shape_regular_mesh_v5.py

      - name: Invoke one central DBTT V5 evaluation and verify ledgers
        run: |
          set -euo pipefail
          python scripts/attest_cavity_source_shape_regular_v5_dbtt.py \
            | tee "$ATTESTATION_DIR/central-dbtt-v5.log"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          committed = json.loads(Path(
              "artifacts/v5_cavity_source_recovery_v5/central_dbtt_v5_readiness.json"
          ).read_text())
          observed = json.loads(Path(os.environ["V5_READINESS_OUTPUT"]).read_text())
          keys = (
              "DBTT_SOURCE_READINESS", "exact_v5_failure_class",
              "oracle_states_accepted", "paired_trajectories_run", "fatigue_started",
              "unexpected_programming_exceptions_caught",
          )
          assert {key: observed[key] for key in keys} == {
              key: committed[key] for key in keys
          }
          assert observed["angular_family"]["required_64_to_128"]["predicates"] == committed[
              "angular_family"
          ]["required_64_to_128"]["predicates"]
          assert observed["fixed_geometry_local_family"]["B_to_C"]["predicates"] == committed[
              "fixed_geometry_local_family"
          ]["B_to_C"]["predicates"]
          assert [row["N_theta"] for row in observed["angular_family"]["required_rows"]] == [64, 128]
          assert [row["local_level"] for row in observed["fixed_geometry_local_family"]["rows"]] == ["A", "B", "C"]
          assert observed["exact_v5_failure_class"] == ["RAW_ADJACENT_ELEMENT_TRACTION"]
          PY
          python scripts/build_v5_unified_lineage_records.py
          git diff --exit-code

      - name: Collect exactly forty-six bounded tests
        run: |
          set -euo pipefail
          TEST_FILES=(
            tests/test_v5_unified_model_lineage.py
            tests/test_cavity_source_recovery_v3.py
            tests/test_cavity_source_conforming_geometry_v4.py
            tests/test_cavity_source_shape_regular_mesh_v5.py
          )
          python -m pytest --collect-only -q -p no:cacheprovider "${TEST_FILES[@]}" \
            | tee "$ATTESTATION_DIR/collect-only.log"
          grep -E '^[^[:space:]]+::' "$ATTESTATION_DIR/collect-only.log" \
            > "$ATTESTATION_DIR/collected-node-inventory.txt"
          test "$(wc -l < "$ATTESTATION_DIR/collected-node-inventory.txt" | tr -d ' ')" = 46

      - name: Run bounded lineage, geometry, recovery, and V5 record tests
        id: bounded_tests
        run: |
          set -euo pipefail
          TEST_FILES=(
            tests/test_v5_unified_model_lineage.py
            tests/test_cavity_source_recovery_v3.py
            tests/test_cavity_source_conforming_geometry_v4.py
            tests/test_cavity_source_shape_regular_mesh_v5.py
          )
          python -m pytest -vv -p no:cacheprovider \
            --junitxml="$ATTESTATION_DIR/pytest-junit.xml" "${TEST_FILES[@]}" \
            | tee "$ATTESTATION_DIR/pytest.log"
          python - "$ATTESTATION_DIR/pytest-junit.xml" > "$ATTESTATION_DIR/pytest-counts.txt" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          totals = {key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          print(f"tests={totals['tests']}")
          print(f"passed={totals['tests']-totals['failures']-totals['errors']-totals['skipped']}")
          print(f"failures={totals['failures']}")
          print(f"errors={totals['errors']}")
          print(f"skipped={totals['skipped']}")
          PY
          grep -Fxq 'tests=46' "$ATTESTATION_DIR/pytest-counts.txt"
          grep -Fxq 'passed=46' "$ATTESTATION_DIR/pytest-counts.txt"

      - name: Verify clean bounded worker
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.bounded_tests.outcome }}
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1)"
          {
            echo "workflow_sha=$GITHUB_SHA"
            echo "bounded_test_step_outcome=$TEST_OUTCOME"
            echo 'bounded_test_count=46'
            echo 'V1_INCIDENT_CST_RECOVERY=FAIL_NONCONVERGENT'
            echo 'V2_TWO_RING_RECOVERY=PASS_MANUFACTURED_AND_KIRSCH'
            echo 'V3_OPERATOR_MANUFACTURED_AND_KIRSCH=PASS'
            echo 'V3_CENTRAL_DBTT_GEOMETRY_REGISTRATION=FAIL_POLYGON_VERTEX_VS_NOMINAL_CIRCLE'
            echo 'V3_CENTRAL_DBTT_TENSOR_CONVERGENCE=NOT_RUN'
            echo 'V4_SOURCE_CONFORMING_GEOMETRY=PASS_GEOMETRY_REGISTRATION'
            echo 'V4_CENTRAL_DBTT_TENSOR_CONVERGENCE=PASS'
            echo 'V4_FAILURE_CLASS=NORMAL_DIRECTION_RESOLUTION+TANGENTIAL_DIRECTION_RESOLUTION+MESH_QUALITY'
            echo 'V5_MESH_CONTRACT=CAVITY_SOURCE_SHAPE_REGULAR_LOCAL_PATCH_V5'
            echo 'V5_REQUIRED_MESH_QUALITY=PASS'
            echo 'V5_TENSOR_CONVERGENCE=PASS'
            echo 'V5_RAW_ADJACENT_TRACTION=FAIL'
            echo 'DBTT_SOURCE_READINESS=BLOCKED_WITH_EXACT_V5_FAILURE_CLASS'
            echo 'V5_FAILURE_CLASS=RAW_ADJACENT_ELEMENT_TRACTION'
            echo 'ORACLE_STATES_ACCEPTED=0/18'
            echo 'PAIRED_TRAJECTORIES_RUN=0/12'
            echo 'FATIGUE_IMPLEMENTATION=NOT_STARTED_BY_CONTRACT'
            echo 'clean_worktree=PASS'
            echo 'diff_check=PASS'
          } | tee "$ATTESTATION_DIR/classifications.txt"

      - name: Upload bounded attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-shape-regular-cavity-source-mesh-v5-${{ github.sha }}
          path: ${{ runner.temp }}/v5-shape-regular-v5/
          if-no-files-found: error
          retention-days: 14
