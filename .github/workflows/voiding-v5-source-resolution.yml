name: V5 source-resolution exact-head qualification
run-name: V5 source-resolution ${{ inputs.operation || 'focused' }} @ ${{ github.sha }}

on:
  push:
    branches: [codex/sharp-front-stateful-voiding-v5-finalization-v2]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [focused, rollback, restarts, transitions, reconstruct-development, reconstruct-available, reconstruct-restarts, runtime-diagnostic, storage-preflight, final, recover-final, audit]
        default: focused
        required: true
      source_run_id:
        description: Source final-campaign run for postprocess-only recovery
        required: false
        type: string
      implementation_sha:
        description: Exact source final-campaign implementation SHA
        required: false
        type: string
      causal_artifact_digest:
        description: Digest of the failed causal-neutrality artifact
        required: false
        type: string

jobs:
  storage-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'storage-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/artifacts/
      - name: Verify disposable-runner capacity before the full campaign
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/prepare_v5_ci_storage_v1.sh | tee /tmp/v5-storage-preflight.log
          git diff --check
          test -z "$(git status --short)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-storage-preflight-${{ github.sha }}
          path: /tmp/v5-storage-preflight.log
  focused:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'focused'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[test]'
      - name: Exact implementation head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Execute and require the authoritative complete focused registry
        run: >-
          python scripts/qualify_v5_source_resolution_focused_results_v1.py
          /tmp/v5-source-resolution/focused.xml
          /tmp/v5-source-resolution/focused.json --execute
      - name: Clean worktree and diff
        if: always()
        run: |
          git diff --check
          test -z "$(git status --short)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-source-resolution-development-${{ github.sha }}
          path: /tmp/v5-source-resolution
  phase8:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'rollback' || inputs.operation == 'restarts' || inputs.operation == 'transitions')
    uses: ./.github/workflows/voiding-v5-phase8-development.yml
    with:
      section: ${{ inputs.operation }}
  final-campaign:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'final'
    uses: ./.github/workflows/voiding-v5-source-final-campaign.yml
  final-campaign-recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'recover-final'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/voiding-v5-final-campaign-recovery.yml
    with:
      source_run_id: ${{ inputs.source_run_id }}
      implementation_sha: ${{ inputs.implementation_sha }}
      causal_artifact_digest: ${{ inputs.causal_artifact_digest }}
  publication-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit'
    uses: ./.github/workflows/voiding-v5-publication-audit.yml
  development-reconstruction:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'reconstruct-development' || inputs.operation == 'reconstruct-available' || inputs.operation == 'reconstruct-restarts')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/voiding-v5-development-reconstruction.yml
    with:
      sections: ${{ inputs.operation == 'reconstruct-available' && '["transitions","rollback"]' || inputs.operation == 'reconstruct-restarts' && '["restarts"]' || '["transitions","restarts","rollback"]' }}
  runtime-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'runtime-diagnostic'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/voiding-v5-runtime-diagnostic.yml
