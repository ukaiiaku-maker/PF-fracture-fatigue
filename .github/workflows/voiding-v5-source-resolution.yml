name: V5 source-resolution exact-head qualification
run-name: V5 source-resolution ${{ inputs.operation || 'focused' }} @ ${{ github.sha }}

on:
  push:
    branches: [codex/sharp-front-stateful-voiding-v5-finalization-v2]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [focused, rollback, restarts, transitions, reconstruct-development, runtime-diagnostic, final, audit]
        default: focused
        required: true

jobs:
  focused:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'focused'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[test]'
      - name: Exact implementation head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Geometry, recovery, source proof, and physical-clock regressions
        run: >-
          python -m pytest -q tests/test_quality_constrained_mesh_v1.py
          tests/test_source_transfer_budget_v1.py tests/test_cavity_boundary_patch_recovery_v1.py
          tests/test_cavity_recovery_transfer_budget_v1.py tests/test_canonical_kinetic_time_v1.py
          tests/test_boundary_segment_bounding_v1.py tests/test_v12_mechanically_separating_wake.py
          tests/test_production_source_resolution_v3.py tests/test_closure_lifecycle_evidence.py
          tests/test_closure_lifecycle_rollback.py tests/test_voiding_lifecycle_driver_v5.py
          tests/test_voiding_v5.py tests/test_static_numerical_family_v1.py
          tests/test_compressed_closure_checkpoint_v1.py tests/test_disabled_causal_neutrality_v1.py
          tests/test_source_resolution_campaign_v1.py
          tests/test_common_restart_protocol_v1.py
          tests/test_final_campaign_archive_v1.py
          tests/test_v5_numerical_runtime_v1.py
          --junitxml=/tmp/v5-source-resolution/focused.xml
      - name: Clean worktree and diff
        if: always()
        run: |
          git diff --check
          test -z "$(git status --short)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-source-resolution-development-${{ github.sha }}
          path: /tmp/v5-source-resolution
  phase8:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'rollback' || inputs.operation == 'restarts' || inputs.operation == 'transitions')
    uses: ./.github/workflows/voiding-v5-phase8-development.yml
    with:
      section: ${{ inputs.operation }}
  final-campaign:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'final'
    uses: ./.github/workflows/voiding-v5-source-final-campaign.yml
  publication-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit'
    uses: ./.github/workflows/voiding-v5-publication-audit.yml
  development-reconstruction:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reconstruct-development'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/voiding-v5-development-reconstruction.yml
  runtime-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'runtime-diagnostic'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/voiding-v5-runtime-diagnostic.yml
