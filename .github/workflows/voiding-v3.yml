name: V12 stateful voiding V3
on:
  push:
    branches: [codex/sharp-front-stateful-voiding-v3]
  pull_request:
    branches: [codex/v12-sharp-wake-production-integration]
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy scipy pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_stage3_criterion_v3.py tests/test_voiding_v3.py tests/test_explicit_cavity_v3.py tests/test_topology_transaction_v11.py
      - run: PYTHONPATH=. python scripts/qualify_voiding_v3.py /tmp/evidence-a
      - run: PYTHONPATH=. python scripts/qualify_voiding_v3.py /tmp/evidence-b
      - run: diff -rq /tmp/evidence-a /tmp/evidence-b
      - run: git diff --check
