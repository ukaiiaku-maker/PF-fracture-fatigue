name: Final piecewise-equilibrated traction diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-piecewise-equilibrated-traction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-v7-traction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Initialize bounded attestation directory
        run: |
          echo "ATTESTATION_DIR=${RUNNER_TEMP}/v7-traction" >> "$GITHUB_ENV"
          echo "V7_READINESS_OUTPUT=${RUNNER_TEMP}/v7-traction/central-dbtt-v7-readiness.json" >> "$GITHUB_ENV"
          echo "MPLCONFIGDIR=${RUNNER_TEMP}/matplotlib-v7-traction" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/v7-traction" "${RUNNER_TEMP}/matplotlib-v7-traction"

      - name: Partial sparse checkout of bounded inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone \
            /arrhenius_fracture/ \
            /artifacts/v5_cavity_source_recovery_v2/attestation.json \
            /artifacts/v5_cavity_source_recovery_v3/ \
            /artifacts/v5_cavity_source_recovery_v4/ \
            /artifacts/v5_cavity_source_recovery_v5/ \
            /artifacts/v6_cavity_source_raw_traction_closure/ \
            /artifacts/v7_piecewise_equilibrated_stress_v2/ \
            /scripts/attest_cavity_source_shape_regular_v5_dbtt.py \
            /scripts/attest_piecewise_equilibrated_stress_v2_dbtt.py \
            /scripts/qualify_piecewise_equilibrated_stress_v2.py \
            /tests/__init__.py \
            /tests/test_v5_unified_model_lineage.py \
            /tests/test_cavity_source_shape_regular_mesh_v5.py \
            /tests/test_equilibrium_observables_v6.py \
            /tests/test_cavity_source_raw_traction_closure_v6.py \
            /tests/test_production_closure_contract.py \
            /tests/test_piecewise_equilibrated_stress_v2_contract.py \
            /tests/test_arc_resolved_cavity_traction_v1.py \
            /tests/test_piecewise_equilibrated_boundary_stress_v2.py \
            /tests/test_piecewise_equilibrated_stress_v2_dbtt.py \
            /V5_UNIFIED_MODEL_LINEAGE.md \
            /V5_VOIDING_EXTENSION_DELTA.md \
            /V6_CAVITY_SOURCE_RAW_TRACTION_CLOSURE.md \
            /V7_PIECEWISE_EQUILIBRATED_TRACTION_DIAGNOSIS.md \
            /v5_unified_model_lineage.json \
            /v5_voiding_extension_delta.json \
            /pyproject.toml \
            /requirements-v5-source-resolution-ci.txt
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          for source in \
            7e71b8f27b0682060fd161e7e5e8fe0d3587e8ac \
            0238aae096aa29e79829d3c562383c38f2290ad6 \
            b3d0add6cbb0605adaa3e04006fe987961ad6452 \
            ca4abfe47765fcdaf0d266bfc0558ecd82d0c64e \
            619b66b0f538742482e7385ddd3d0171cb3edd8b; do
            git fetch --no-tags --depth=2 --filter=blob:none origin "$source"
          done
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-v5-source-resolution-ci.txt

      - name: Install frozen numerical environment
        run: python -m pip install -e '.[test]' -r requirements-v5-source-resolution-ci.txt

      - name: Qualify and reproduce only D and E
        run: |
          set -euo pipefail
          python scripts/qualify_piecewise_equilibrated_stress_v2.py | tee "$ATTESTATION_DIR/qualification.log"
          V7_SOURCE_COMMIT="$GITHUB_SHA" python scripts/attest_piecewise_equilibrated_stress_v2_dbtt.py \
            | tee "$ATTESTATION_DIR/central-dbtt-v7.log"
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          committed=json.loads(Path("artifacts/v7_piecewise_equilibrated_stress_v2/central_dbtt_v7_readiness.json").read_text())
          observed=json.loads(Path(os.environ["V7_READINESS_OUTPUT"]).read_text())
          assert observed["executed_code_sha"] == os.environ["GITHUB_SHA"]
          assert observed["exact_failure"] == ["PIECEWISE_BOUNDARY_TRACTION"]
          assert observed["DBTT_SOURCE_READINESS"] == "BLOCKED_WITH_EXACT_FAILURE"
          assert {k for k,v in observed["predicates"].items() if not v} == {"piecewise_boundary_traction"}
          for key in ("piecewise_traction_D", "piecewise_traction_E", "piecewise_traction_relative_D_to_E"):
              assert math.isclose(observed[key], committed[key], rel_tol=1e-10, abs_tol=1e-13)
          assert not observed["actual_production_event_executed"]
          assert not observed["oracle_generated"]
          assert not observed["oneD_changed"]
          PY

      - name: Run exactly fifty-four bounded tests
        run: |
          set -euo pipefail
          TEST_FILES=(
            tests/test_v5_unified_model_lineage.py
            tests/test_cavity_source_shape_regular_mesh_v5.py
            tests/test_equilibrium_observables_v6.py
            tests/test_cavity_source_raw_traction_closure_v6.py
            tests/test_production_closure_contract.py
            tests/test_piecewise_equilibrated_stress_v2_contract.py
            tests/test_arc_resolved_cavity_traction_v1.py
            tests/test_piecewise_equilibrated_boundary_stress_v2.py
            tests/test_piecewise_equilibrated_stress_v2_dbtt.py
          )
          python -m pytest --collect-only -q -p no:cacheprovider "${TEST_FILES[@]}" \
            | tee "$ATTESTATION_DIR/collect-only.log"
          grep -E '^[^[:space:]]+::' "$ATTESTATION_DIR/collect-only.log" \
            > "$ATTESTATION_DIR/collected-node-inventory.txt"
          test "$(wc -l < "$ATTESTATION_DIR/collected-node-inventory.txt" | tr -d ' ')" = 54
          python -m pytest -vv -p no:cacheprovider \
            --junitxml="$ATTESTATION_DIR/pytest-junit.xml" "${TEST_FILES[@]}" \
            | tee "$ATTESTATION_DIR/pytest.log"

      - name: Record bounded manifest
        if: always()
        run: |
          {
            echo "workflow_head=${GITHUB_SHA}"
            echo "oneD_changed=false"
            echo "production_event_executed=false"
            echo "oracle_generated=false"
            echo "paired_trajectories_run=false"
            echo "fatigue_started=false"
          } > "$ATTESTATION_DIR/manifest.txt"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-piecewise-equilibrated-traction-${{ github.sha }}
          path: ${{ runner.temp }}/v7-traction/
          if-no-files-found: error
          retention-days: 14
