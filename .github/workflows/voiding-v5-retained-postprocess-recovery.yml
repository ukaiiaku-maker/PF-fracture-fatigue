name: V5 retained-capture postprocessing recovery
run-name: V5 retained postprocessing ${{ inputs.operation || 'repair' }} @ ${{ github.sha }}
on:
  push:
    branches: [codex/sharp-front-stateful-voiding-v5-finalization-v2]
    paths:
      - .github/workflows/voiding-v5-retained-postprocess-recovery.yml
      - artifacts/voiding_v5_source_resolution_and_final_closure/postprocessing_recovery/tools/**
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [repair, assemble]
        default: repair
        required: true

permissions:
  contents: read
  actions: read
env:
  PHYSICAL_SHA: 63d53cdbad9125ef0d5180551974ac0e3a3ef721
  ORIGINAL_RUN_ID: '34205485025'
  V5_PHYSICAL_WORKTREE: /tmp/v5-frozen-physical-I
  V5_FAILED_CAPTURE_ROOT: /tmp/original-causal-neutrality/causal-neutrality
  RECOVERY_TOOLS: artifacts/voiding_v5_source_resolution_and_final_closure/postprocessing_recovery/tools

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/artifacts/voiding_v5_source_resolution_and_final_closure/development/
      - name: Reserve disposable runner storage
        run: bash scripts/prepare_v5_ci_storage_v1.sh
      - name: Install the missing code-consumer audit dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - run: pip install -e '.[test]' -r requirements-v5-source-resolution-ci.txt
      - name: Configure unchanged prospective numerical policy
        run: python scripts/v5_numerical_runtime_v1.py --github-env "$GITHUB_ENV"
      - name: Verify kernels and create clean frozen source worktrees
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/v5_numerical_runtime_v1.py
          git worktree add --detach --no-checkout "$V5_PHYSICAL_WORKTREE" "$PHYSICAL_SHA"
          git -C "$V5_PHYSICAL_WORKTREE" sparse-checkout set --no-cone '/*' '!/artifacts/'
          git -C "$V5_PHYSICAL_WORKTREE" checkout
          git worktree add --detach --no-checkout /tmp/v5-frozen-stage2-base 326e3f5973ef623781ab8568798c495a3f68238c
          git -C /tmp/v5-frozen-stage2-base sparse-checkout set --no-cone '/*' '!/artifacts/'
          git -C /tmp/v5-frozen-stage2-base checkout
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '34205485025'
          name: v5-source-final-shard-causal-neutrality-63d53cdbad9125ef0d5180551974ac0e3a3ef721
          path: /tmp/original-causal-neutrality
      - name: Test unchanged predicates and prohibit physical worker invocation
        run: python -m pytest -q "$RECOVERY_TOOLS/test_retained_neutrality_postprocess.py"
      - name: Complete A and B reports from retained source-bound captures only
        run: |
          set -euo pipefail
          for side in a b; do
            python "$RECOVERY_TOOLS/v5_retained_neutrality_postprocess.py" repair --implementation "$V5_PHYSICAL_WORKTREE" --base /tmp/v5-frozen-stage2-base --source "$V5_FAILED_CAPTURE_ROOT/$side" --output "/tmp/repaired-causal-neutrality/causal-neutrality/$side" --recovery-sha "$GITHUB_SHA"
            python "$RECOVERY_TOOLS/v5_retained_neutrality_postprocess.py" repair --implementation "$V5_PHYSICAL_WORKTREE" --base /tmp/v5-frozen-stage2-base --source "/tmp/repaired-causal-neutrality/causal-neutrality/$side/retained_failed_attempt" --output "/tmp/reconstructed-causal-neutrality/$side" --recovery-sha "$GITHUB_SHA"
            diff -ru "/tmp/repaired-causal-neutrality/causal-neutrality/$side" "/tmp/reconstructed-causal-neutrality/$side"
          done
          diff -ru /tmp/repaired-causal-neutrality/causal-neutrality/a /tmp/repaired-causal-neutrality/causal-neutrality/b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-source-final-repaired-causal-neutrality-${{ env.PHYSICAL_SHA }}-${{ github.sha }}
          path: /tmp/repaired-causal-neutrality
      - name: Require all original physical shards terminal before complete assembly
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'assemble'
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({...context.repo, run_id:34205485025});
            if (run.data.head_sha !== process.env.PHYSICAL_SHA || run.data.status !== 'completed') throw new Error('original campaign is not terminal at I');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id:34205485025, per_page:100});
            const phases = jobs.filter(j => j.name.startsWith('final-campaign / phase ('));
            if (phases.length !== 35 || phases.some(j => j.status !== 'completed')) throw new Error('incomplete original physical registry');
            const failed = phases.filter(j => j.conclusion !== 'success');
            if (failed.length !== 1 || !failed[0].name.includes('(causal-neutrality,')) throw new Error('additional original phase failure requires separate classification');
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'assemble'
        with:
          github-token: ${{ github.token }}
          run-id: '34205485025'
          pattern: v5-source-final-shard-*-${{ env.PHYSICAL_SHA }}
          path: /tmp/source-final-shards
          merge-multiple: true
      - name: Preserve original failure and assemble once using frozen implementation
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'assemble'
        run: |
          set -euo pipefail
          mv /tmp/source-final-shards/causal-neutrality /tmp/original-failed-causal-neutrality-for-assembly
          mv /tmp/repaired-causal-neutrality/causal-neutrality /tmp/source-final-shards/causal-neutrality
          python "$V5_PHYSICAL_WORKTREE/scripts/assemble_v5_source_resolution_campaign_v1.py" /tmp/source-final-shards /tmp/source-final-complete
          diff -ru /tmp/source-final-complete/a /tmp/source-final-complete/b
          python "$V5_PHYSICAL_WORKTREE/scripts/package_v5_final_campaign_v1.py" pack /tmp/source-final-complete /tmp/source-final-publication --implementation-sha "$PHYSICAL_SHA"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'assemble'
        with:
          name: v5-source-final-complete-recovered-${{ env.PHYSICAL_SHA }}-${{ github.sha }}
          path: /tmp/source-final-complete
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'assemble'
        with:
          name: v5-source-final-publication-${{ env.PHYSICAL_SHA }}
          path: /tmp/source-final-publication
      - name: Clean recovery, physical implementation and historical worktrees
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          test -z "$(git status --short)"
          test -z "$(git -C "$V5_PHYSICAL_WORKTREE" status --short)"
          test -z "$(git -C /tmp/v5-frozen-stage2-base status --short)"
