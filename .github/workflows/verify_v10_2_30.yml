name: Verify v10.2.30 hazard-energy-gated fatigue

on:
  push:
    branches:
      - v10.2.30-hazard-energy-gated-fatigue-events
  pull_request:
    branches:
      - v10.2.29-hazard-cyclic-fatigue-long-growth

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile v10.2.30 modules and tools
        run: |
          python -m py_compile \
            arrhenius_fracture/stochastic_avalanche_backend.py \
            arrhenius_fracture/hazard_energy_event_gate_v10230.py \
            arrhenius_fracture/hazard_energy_event_gate_mesh_consistent_v10230.py \
            arrhenius_fracture/persistent_site_cyclic_energy_gated_v10230.py \
            arrhenius_fracture/persistent_site_cyclic_energy_gated_corrected_v10230.py \
            arrhenius_fracture/persistent_site_trial_clone_v10230.py \
            arrhenius_fracture/persistent_site_vhcf_selector_v10230.py \
            arrhenius_fracture/persistent_site_vhcf_coupled_selector_v10230.py \
            arrhenius_fracture/persistent_site_forward_coupled_hazard_v10230.py \
            arrhenius_fracture/persistent_site_forward_robust_v10230.py \
            arrhenius_fracture/persistent_site_forward_selector_v10230.py \
            arrhenius_fracture/persistent_site_high_cycle_state_v10230.py \
            arrhenius_fracture/persistent_site_poincare_v10230.py \
            arrhenius_fracture/persistent_site_periodic_solver_v10230.py \
            arrhenius_fracture/persistent_site_high_cycle_propagation_v10230.py \
            arrhenius_fracture/persistent_site_high_cycle_dmd_v10230.py \
            arrhenius_fracture/persistent_site_high_cycle_dmd_v10230_v2.py \
            arrhenius_fracture/persistent_site_high_cycle_dmd_v10230_v3.py \
            arrhenius_fracture/persistent_site_high_cycle_engine_v10230_v2.py \
            arrhenius_fracture/persistent_site_high_cycle_engine_v10230_v3.py \
            arrhenius_fracture/persistent_site_high_cycle_engine_v10230_v4.py \
            arrhenius_fracture/persistent_site_high_cycle_engine_v10230.py \
            arrhenius_fracture/active_state_block_control_v10230.py \
            arrhenius_fracture/feedback_state_block_control_v10230.py \
            arrhenius_fracture/sharp_front_v10_2_30_energy_gated_fatigue.py \
            arrhenius_fracture/sharp_front_v10_2_30_fixed_deltaK.py \
            scripts/v10230_active_state_runtime/sitecustomize.py \
            scripts/analyze_v10_2_30_energy_gated_qualification.py \
            scripts/analyze_v10_2_30_weakt_transient_diagnostic.py \
            scripts/analyze_v10_2_30_high_cycle_visuals.py \
            scripts/compare_v10_2_30_weakt_partition_equivalence.py
          bash -n scripts/run_v10_2_30_three_deltaK_energy_gate_qualification.sh
          bash -n scripts/run_v10_2_30_four_class_three_deltaK_energy_gate_qualification.sh
          bash -n scripts/run_v10_2_30_300K_four_class_fatigue.sh
          bash -n scripts/run_v10_2_30_300K_four_class_fatigue_active_state.sh
          bash -n scripts/run_v10_2_30_300K_four_class_fatigue_feedback_state.sh
          bash -n scripts/run_v10_2_30_weakt_feedback_block_smoke.sh
          bash -n scripts/run_v10_2_30_weakt_0p55_transient_diagnostic.sh
          bash -n scripts/run_v10_2_30_weakt_partition_robust_gate.sh
          bash -n scripts/run_v10_2_30_weakt_0p55_high_cycle_1e12.sh
          bash -n scripts/run_v10_2_30_weakt_high_cycle_1e12.sh
      - name: Run v10.2.30 regressions
        run: |
          python -m pytest -q --tb=short \
            tests/test_v10_2_30_high_cycle_engine.py \
            tests/test_v10_2_30_high_cycle_exact_burst.py \
            tests/test_v10_2_30_high_cycle_affine_dmd.py \
            tests/test_v10_2_30_high_cycle_launcher.py \
            tests/test_v10_2_30_high_cycle_visuals.py \
            tests/test_v10_2_30_audit_p0_invariants.py \
            tests/test_v10_2_30_forward_coupled_marcher.py \
            tests/test_v10_2_30_partition_robust_forward.py \
            tests/test_v10_2_30_transient_diagnostic.py \
            tests/test_v10_2_30_partition_equivalence.py \
            tests/test_v10_2_30_diagnostic_serialization.py \
            tests/test_v10_2_30_active_state_block_control.py \
            tests/test_v10_2_30_feedback_state_block_control.py \
            tests/test_v10_2_30_hazard_energy_gate.py \
            tests/test_v10_2_30_energy_gate_contract.py \
            tests/test_v10_2_30_transactional_engine.py \
            tests/test_v10_2_30_entry_wiring.py \
            tests/test_v10_2_30_fixed_deltaK_entry.py \
            tests/test_v10_2_30_qualification_tools.py \
            tests/test_v10_2_30_four_class_qualification_runner.py \
            tests/test_v10_2_30_vhcf_performance.py \
            tests/test_v10_2_29_fixed_deltaK_entry.py \
            tests/test_v10_2_29_event_cycle_accounting.py \
            tests/test_v10_2_29_state_coupled_hazard.py \
            tests/test_v10_2_29_coupled_transient_prepost.py
