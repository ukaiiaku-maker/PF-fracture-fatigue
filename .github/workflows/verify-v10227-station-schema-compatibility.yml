name: Verify v10.2.27 station schema compatibility

on:
  push:
    branches:
      - v10.2.27-paper-four-class-30deg-long-rcurves
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas matplotlib scipy
      - name: Compile kernel response paths
        run: |
          python -m py_compile \
            arrhenius_fracture/physical_fem_station_responses_v10212.py \
            arrhenius_fracture/frozen_geometry_load_invariance_v10213.py \
            scripts/evaluate_v10_2_14_active_load_invariance.py
      - name: Test mesh resolution and schema compatibility
        run: |
          python -m pytest -q \
            tests/test_v10227_mesh_resolved_active_station_selection.py \
            tests/test_v10227_station_response_schema_compatibility.py
      - name: Validate kernel builder shell
        run: |
          bash -n scripts/build_v10_2_27_kernel_for_configuration.sh
