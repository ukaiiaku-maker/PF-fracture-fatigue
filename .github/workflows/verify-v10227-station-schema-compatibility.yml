name: Verify v10.2.27 frozen physics contract

on:
  push:
    branches:
      - v10.2.27-paper-four-class-30deg-long-rcurves
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pandas matplotlib scipy
      - name: Compile production and kernel response paths
        run: |
          python -m py_compile \
            arrhenius_fracture/fractional_moving_frame.py \
            arrhenius_fracture/kinetic_tip_cell.py \
            arrhenius_fracture/frozen_measurement_reconstruction_v10227.py \
            arrhenius_fracture/physical_fem_capture_v10212.py \
            arrhenius_fracture/physical_fem_capture_v10213.py \
            arrhenius_fracture/sharp_front_v10_2_13_capture.py \
            arrhenius_fracture/physical_fem_station_responses_v10212.py \
            arrhenius_fracture/frozen_geometry_load_invariance_v10213.py \
            arrhenius_fracture/kernel_configuration_v10227.py \
            arrhenius_fracture/kernel_resolver_v10227.py \
            scripts/check_v10_2_27_capture_physics_contract.py \
            scripts/build_v10_2_27_kernel_from_current_mechanics.py \
            scripts/evaluate_v10_2_14_active_load_invariance.py \
            scripts/ensure_v10_2_27_signed_kernel.py
      - name: Test frozen physics and cache safety
        run: |
          python -m pytest -q \
            tests/test_v10227_station_response_schema_compatibility.py \
            tests/test_v10227_no_synthetic_kernel_capture.py \
            tests/test_v10227_reuse_mode_guard.py \
            tests/test_v10_2_27_capture_physics_invariance.py \
            tests/test_v10_2_27_kernel_resolution.py \
            tests/test_v10_2_27_capture_output_contract.py
      - name: Validate production and kernel shell scripts
        run: |
          bash -n scripts/build_v10_2_27_kernel_for_configuration.sh
          bash -n scripts/run_v10_2_27_paper_four_class_30deg_long_rcurves.sh
          bash -n scripts/run_v10_2_27_physics_frozen_single_case_smoke.sh
