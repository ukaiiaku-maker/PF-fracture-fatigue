[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arrhenius-sharp-front-mpz"
version = "10.2.30"
description = "Hazard-energy-gated anisotropic persistent-site PF/sharp-front fatigue"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]
analysis = ["pandas>=2"]

[tool.setuptools]
packages = ["arrhenius_fracture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not external_evidence'"
markers = [
  "external_evidence: requires a manifest-restored external evidence root",
]

[tool.setuptools.package-data]
arrhenius_fracture = ["data/materials/*.csv", "data/materials/*.json", "data/materials/*/*.csv", "data/materials/*/*.json"]
